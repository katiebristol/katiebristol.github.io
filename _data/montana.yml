- url: montana001.jpg
  alt: "Gallatin Gateway"
  title: "Gallatin Gateway"
  caption: "Roadside views north of Yellowstone National Park.<br><br>We flew into Salt Lake City in order to get rental cars with 4WD. This meant driving through Yellowstone and up to our field sites.<br><br> <i>Gallatin Gateway, Montana (2021)</i>"
- url: montana002.jpg
  alt: "Crossing the Missouri River"
  title: "Crossing the Missouri River"
  caption: "One of our fieldsites was on the other side of the Missouri River. To cross, we took the historic Stafford Ferry.<br><br><i>Winifred, Montana (2021)</i>"
- url: montana003.jpg
  alt: "Crossing the Missouri River"
  title: "Crossing the Missouri River"
  caption: "One of our fieldsites was on the other side of the Missouri River. To cross, we took the historic Stafford Ferry. There is a telephone located in a mailbox that you use to call the operator.<br><br><i>Winifred, Montana (2021)</i>"
- url: montana004.jpg
  alt: "The KPg Boundary"
  title: "The KPg"
  caption: "Outcropping of the Cretaceous-Paleogene (KPg) boundary, the boundary that marks the mass extinction which killed the dinosaurs.<br><br><i>Hell Creek Region, Montana (2021)</i>"
- url: montana005.jpg
  alt: "Field Sampling"
  title: "Field Sampling"
  caption: "Fellow PhD student Hee Jun Cheong (left) and our advisor Dr. Courtney Sprain (right) sampling in the field.<br><br><i>Hell Creek Region, Montana (2021)</i>
- url: montana006.jpg
  alt: "Layered Butte"
  title: "Layered Butte"
  caption: "The Hell Creek Region features many of these gorgeous layered buttes. Person for scale.<br><br><i>Hell Creek Region, Montana (2021)</i>
- url: montana007.jpg
  alt: "Dinosaur Bones"
  title: "Dinosaur Bones"
  caption: "The Hell Creek Region is also peppered with dinosaur bones. While some are excavated and preserved, many become exposed by rain and erosion and break apart before researchers can get to them.<br><br>It is illegal to collect these bones without proper permits, but you can take photos!<br><br><i>Hell Creek Region, Montana (2021)</i>"
