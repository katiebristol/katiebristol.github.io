- url: nz001.jpg
  alt: "Flame Structures"
  title: "Flame Structures"
  caption: "Flame structures in sedimentary rocks.<br><br>A type of soft-sediment deformation that forms when soft mud pushes up into an overlying layer of heavier sand.<br><br><i>South Island, New Zealand (2017)</i>"
- url: nz002.jpg
  alt: "Active Bioturbation"
  title: "Active Bioturbation Zone"
  caption: "A zone featuring active bioturbation.<br><br>This occurs when small burrowing sea creatures disrupt the sediments. Later, these burrows can be preserved in the rock as trace fossils.<br><br><i>Kaikoura, New Zealand (2017)</i>"
- url: nz003.jpg
  alt: "Sigma Porphyroclast"
  title: "Sigma Porphyroclast"
  caption: "A large sigma porphyroclast in the Paparoa Metamorphic Core Complex.<br><br>Consisting of a larger relict core grain (the porphyroclast) and surrounding asymmetric tails, this grain can help us determine the direction of movement (shear sense).<br><br><i>South Island, New Zealand (2017)</i>"
- url: nz004.jpg
  alt: "Kaikoura"
  title: "Kaikoura"
  caption: "A view across the Kaikoura Peninsula, looking towards the Southern Alps.<br><br>Because Kaikoura sits directly on top of the highly active Pacific-Australian plate boundary, it is always changing.<br><br><i>Kaikoura, New Zealand (2017)</i>"
- url: nz009.jpg
  alt: "Sea Platform"
  title: "Newly Exposed Sea Platform"
  caption: "Newly exposed sea platform at the Kaikoura Peninsula.<br><br>In 2016, a magnitude 7.8 earthquake struck Kaikoura, lifting the sea platform out of the water by 0.5-6 meters.<br><br><i>Kaikoura, New Zealand (2017)</i>"
- url: nz006.jpg
  alt: "Cass Field Station"
  title: "Cass Field Station"
  caption: "A tent set up at the Cass Field Station.<br><br><i>Cass, New Zealand (2017)</i>"
- url: nz007.jpg
  alt: "Punakaiki"
  title: "Punakaiki"
  caption: "The famous pancake rocks of Punakaiki.<br><br>These heavily eroded limestones formed around 30 Myr ago and are famous for resembling stacks of pancakes.<br><br><i>Punakaiki, New Zealand (2017)</i>"
- url: nz008.jpg
  alt: "Colorful Schists"
  title: "Colorful Schists at Ruby Island"
  caption: "Colorful schists outcropping on Ruby Island in Lake Wanaka.<br><br><i>Wanaka, New Zealand (2017)</i>"
- url: nz005.jpg
  alt: "Mount Ngauruhoe"
  title: "Mount Ngaurhoe"
  caption: "One of our field exercises involved mapping the lava flows on the flanks of this active volcano.<br><br>This volcano was the physical stand in for Mount Doom during the filming of The Lord of the Rings trilogy.<br><br><i>Manawatū-Whanganui Region New Zealand (2017)</i>"
- url: nz010.jpg
  alt: "Whakaari / White Island"
  title: "Whakaari / White Island"
  caption: "The crater of the active Whakaari volcano.<br><br><i>Bay of Plenty, New Zealand (2017)</i>"
- url: nz011.jpg
  alt: "Ignimbrite"
  title: "Ignimbrite"
  caption: "Massive ignimbrite deposit (person for scale).<br><br><i>North Island, New Zealand (2017)</i>"
