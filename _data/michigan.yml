- url: michigan009.jpg
  alt: "Mackinac Bridge"
  title: "Mackinac Bridge"
  caption: "The Mackinac Bridge is a massive suspension bridge which connects the lower and upper peninsulas of Michigan.<br><br>Growing up, I crossed this bridge often. When I finally saw the iconic Golden Gate bridge in San Francisco, I was let down by how small it was.<br><br><i>Saint Ignace, Michigan (2025)</i>"
- url: michigan010.jpg
  alt: "Kitch-iti-kipi"
  title: "Kitch-iti-kipi"
  caption: "Michigan's largest freshwater spring - 200 feet wide by 40 feet deep. The water really is that blue!<br><br>The spring never freezes even in harsh Upper Peninsula winters as the water is 45 degrees F year round.<br><br><i>Manistique, Michigan (2021)</i>"
