- url: nz004.jpg
  alt: "Kaikoura"
  title: "Kaikōura"
  caption: "A view across the Kaikōura Peninsula, looking towards the northern portion of the Southern Alps.<br><br>Because Kaikōura sits directly on top of the highly active Pacific-Australian plate boundary, it is always changing.<br><br> <i>Kaikōura, New Zealand (2017)</i>"
- url: nz005.jpg
  alt: "Mount Ngāuruhoe"
  title: "Mount Ngāuruhoe"
  caption: "One of our field exercises involved mapping the lava flows on the flanks of Mount Ngāuruhoe, an active stratovolcano. It is the youngest active vent of the larger Mount Tongariro volcanic complex.<br><br>Fun fact: This volcano was the physical stand in for Mount Doom during the filming of The Lord of the Rings trilogy.<br><br><i>Manawatū-Whanganui Region New Zealand (2017)</i>"
- url: nz007.jpg
  alt: "Punakaiki"
  title: "Punakaiki"
  caption: "The famous pancake rocks of Punakaiki.<br><br>These heavily eroded limestones formed around 30 Myr ago and are famous for resembling stacks of pancakes.<br><br><i>Punakaiki, New Zealand (2017)</i>"
- url: nz009.jpg
  alt: "Newly Exposed Sea Platform"
  title: "Newly Exposed Sea Platform"
  caption: "Newly exposed sea platform at the Kaikōura Peninsula.<br><br>In 2016, a magnitude 7.8 earthquake struck Kaikōura, lifting the sea platform out of the water by 0.5-6 meters.<br><br><i>Kaikōura, New Zealand (2017)</i>"
- url: nz006.jpg
  alt: "Cass Field Station"
  title: "Cass Field Station"
  caption: "A tent set up outside of Cass Field Station where we stayed while studying the geology of the Upper Waimakariri Basin in the Canterbury high country.<br><br><i>Canterbury Region, New Zealand (2017)</i>"
- url: nz008.jpg
  alt: "Colorful Schists"
  title: "Colorful Schists at Mātakitaki"
  caption: "Colorful schists outcropping on Mātakitaki (Ruby Island) in Lake Wānaka.<br><br>This strongly foliated Otago Schist is bedrock carved out by massive alpine glaciers which retreated more than 10 kyr ago.<br><br><i>Wānaka, New Zealand (2017)</i>"
- url: nz010.jpg
  alt: "Whakaari / White Island"
  title: "Whakaari / White Island"
  caption: "The crater of the active andesite stratovolcano Whakaari (White Island).<br><br>Visits to the island are now prohibited after the tragic eruption in 2019.<br><br><i>Whakatāne, New Zealand (2017)</i>"
- url: nz001.jpg
  alt: "Flame Structures"
  title: "Flame Structures"
  caption: "Flame structures in sedimentary rocks exposed on a beach near Punakaiki.<br><br>This feature is a type of soft-sediment deformation that forms when soft mud pushes up into an overlying layer of heavier sand.<br><br><i>Punakaiki, New Zealand (2017)</i>"
- url: nz002.jpg
  alt: "Active Bioturbation"
  title: "Active Bioturbation Zone"
  caption: "A zone featuring active bioturbation.<br><br>This occurs when small burrowing sea creatures disrupt the sediments. Later, these burrows can be preserved in the rock as trace fossils.<br><br><i>Kaikōura, New Zealand (2017)</i>"
- url: nz003.jpg
  alt: "Sigma Porphyroclast"
  title: "Sigma Porphyroclast"
  caption: "A large sigma porphyroclast in the Paparoa Metamorphic Core Complex.<br><br>Consisting of a larger relict core grain and surrounding asymmetric tails, this grain is an indicator of direction of movement (shear sense).<br><br><i>Cape Foulwind, New Zealand (2017)</i>"
- url: nz011.jpg
  alt: "Ignimbrite"
  title: "Ignimbrite"
  caption: "Massive ignimbrite deposit (person for scale).<br><br>These deposits formed during a colossal super-eruption from the Okataina Volcanic Center around 300 kyr ago.<br><br><i>Pikowai, New Zealand (2017)</i>"
