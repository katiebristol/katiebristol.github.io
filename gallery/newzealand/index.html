  </script> </head> <body class="fixed-top-nav sticky-bottom-footer"> <header> <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top" role="navigation"> <div class="container"> <a class="navbar-brand title font-weight-lighter" href="/"> <span class="font-weight-bold">Katie</span> E. Bristol </a> <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"> <span class="sr-only">Toggle navigation</span> <span class="icon-bar top-bar"></span> <span class="icon-bar middle-bar"></span> <span class="icon-bar bottom-bar"></span> </button> <div class="collapse navbar-collapse text-right" id="navbarNav"> <ul class="navbar-nav ml-auto flex-nowrap"> <li class="nav-item "> <a class="nav-link" href="/">about </a> </li> <li class="nav-item "> <a class="nav-link" href="/publications/">publications </a> </li> <li class="nav-item active"> <a class="nav-link" href="/gallery/">gallery <span class="sr-only">(current)</span> </a> </li> <li class="nav-item "> <a class="nav-link" href="/cv/">Short CV </a> </li> <li class="nav-item "> <a class="nav-link" href="/teaching-outreach/">Teaching+Outreach </a> </li> <li class="nav-item dropdown "> <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">other </a> <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown"> <a class="dropdown-item " href="/teaching-outreach/">teaching+outreach</a> <div class="dropdown-divider"></div> <a class="dropdown-item " href="/resources/">resources</a> </div> </li> <li class="toggle-container"> <button id="light-toggle" title="Change theme"> <i class="ti ti-sun-moon" id="light-toggle-system"></i> <i class="ti ti-moon-filled" id="light-toggle-dark"></i> <i class="ti ti-sun-filled" id="light-toggle-light"></i> </button> </li> </ul> </div> </div> </nav> <progress id="progress" value="0"> <div class="progress-container"> <span class="progress-bar"></span> </div> </progress> </header> <div class="container mt-5" role="main"> <div class="post"> <header class="post-header"> <h1 class="post-title">New Zealand</h1> <p class="post-description">Field camp through University of Canterbury in Summer 2017.</p> </header> <article> <div class="gallery"> <div class="gallery-item"> <a href="/assets/img/newzealand/nz004.jpg" class="gallery-item glightbox" data-title="Kaikōura" data-description="A view across the Kaikōura Peninsula, looking towards the northern portion of the Southern Alps.&lt;br&gt;&lt;br&gt;Because Kaikōura sits directly on top of the highly active Pacific-Australian plate boundary, it is always changing.&lt;br&gt;&lt;br&gt; &lt;i&gt;Kaikōura, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz004.jpg" alt="Kaikōura"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz005.jpg" class="gallery-item glightbox" data-title="Mount Ngāuruhoe" data-description="One of our field exercises involved mapping the lava flows on the flanks of Mount Ngāuruhoe, an active stratovolcano. It is the youngest active vent of the larger Mount Tongariro volcanic complex.&lt;br&gt;&lt;br&gt;Fun fact: This volcano was the physical stand in for Mount Doom during the filming of The Lord of the Rings trilogy.&lt;br&gt;&lt;br&gt;&lt;i&gt;Manawatū-Whanganui Region New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz005.jpg" alt="Mount Ngāuruhoe"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz007.jpg" class="gallery-item glightbox" data-title="Punakaiki" data-description="The famous pancake rocks of Punakaiki.&lt;br&gt;&lt;br&gt;These heavily eroded limestones formed around 30 Myr ago and are famous for resembling stacks of pancakes.&lt;br&gt;&lt;br&gt;&lt;i&gt;Punakaiki, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz007.jpg" alt="Punakaiki"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz009.jpg" class="gallery-item glightbox" data-title="Newly Exposed Sea Platform" data-description="Newly exposed sea platform at the Kaikōura Peninsula.&lt;br&gt;&lt;br&gt;In 2016, a magnitude 7.8 earthquake struck Kaikōura, lifting the sea platform out of the water by 0.5-6 meters.&lt;br&gt;&lt;br&gt;&lt;i&gt;Kaikōura, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz009.jpg" alt="Newly Exposed Sea Platform"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz006.jpg" class="gallery-item glightbox" data-title="Cass Field Station" data-description="A tent set up outside of Cass Field Station where we stayed while studying the geology of the Upper Waimakariri Basin in the Canterbury high country.&lt;br&gt;&lt;br&gt;&lt;i&gt;Canterbury Region, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz006.jpg" alt="Cass Field Station"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz008.jpg" class="gallery-item glightbox" data-title="Colorful Schists at Mātakitaki" data-description="Colorful schists outcropping on Mātakitaki (Ruby Island) in Lake Wānaka.&lt;br&gt;&lt;br&gt;This strongly foliated Otago Schist is bedrock carved out by massive alpine glaciers which retreated more than 10 kyr ago.&lt;br&gt;&lt;br&gt;&lt;i&gt;Wānaka, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz008.jpg" alt="Colorful Schists at Mātakitaki"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz010.jpg" class="gallery-item glightbox" data-title="Whakaari / White Island" data-description="The crater of the active andesite stratovolcano Whakaari (White Island).&lt;br&gt;&lt;br&gt;Visits to the island are now prohibited after the tragic eruption in 2019.&lt;br&gt;&lt;br&gt;&lt;i&gt;Whakatāne, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz010.jpg" alt="Whakaari / White Island"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz001.jpg" class="gallery-item glightbox" data-title="Flame Structures" data-description="Flame structures in sedimentary rocks exposed on a beach near Punakaiki.&lt;br&gt;&lt;br&gt;This feature is a type of soft-sediment deformation that forms when soft mud pushes up into an overlying layer of heavier sand.&lt;br&gt;&lt;br&gt;&lt;i&gt;Punakaiki, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz001.jpg" alt="Flame Structures"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz002.jpg" class="gallery-item glightbox" data-title="Active Bioturbation Zone" data-description="A zone featuring active bioturbation.&lt;br&gt;&lt;br&gt;This occurs when small burrowing sea creatures disrupt the sediments. Later, these burrows can be preserved in the rock as trace fossils.&lt;br&gt;&lt;br&gt;&lt;i&gt;Kaikōura, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz002.jpg" alt="Active Bioturbation Zone"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz003.jpg" class="gallery-item glightbox" data-title="Sigma Porphyroclast" data-description="A large sigma porphyroclast in the Paparoa Metamorphic Core Complex.&lt;br&gt;&lt;br&gt;Consisting of a larger relict core grain and surrounding asymmetric tails, this grain is an indicator of direction of movement (shear sense).&lt;br&gt;&lt;br&gt;&lt;i&gt;Cape Foulwind, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz003.jpg" alt="Sigma Porphyroclast"> </a> </div> <div class="gallery-item"> <a href="/assets/img/newzealand/nz011.jpg" class="gallery-item glightbox" data-title="Ignimbrite" data-description="Massive ignimbrite deposit (person for scale).&lt;br&gt;&lt;br&gt;These deposits formed during a colossal super-eruption from the Okataina Volcanic Center around 300 kyr ago.&lt;br&gt;&lt;br&gt;&lt;i&gt;Pikowai, New Zealand (2017)&lt;/i&gt;"> <img src="/assets/img/newzealand/nz011.jpg" alt="Ignimbrite"> </a> </div> </div> <link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet"> <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script> <script>
