north of Yellowstone National Park.&lt;br&gt;&lt;br&gt;We flew into Salt Lake City in order to get rental cars with 4WD. This meant driving through Yellowstone and up to our field sites.&lt;br&gt;&lt;br&gt; &lt;i&gt;Gallatin Gateway, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana001.jpg" alt="Gallatin Gateway"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana002.jpg" class="gallery-item glightbox" data-title="Crossing the Missouri River" data-description="One of our fieldsites was on the other side of the Missouri River. To cross, we took the historic Stafford Ferry. There is a telephone located in a mailbox that you use to call the operator.&lt;br&gt;&lt;br&gt;&lt;i&gt;Winifred, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana002.jpg" alt="Crossing the Missouri River"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana003.jpg" class="gallery-item glightbox" data-title="Upper Missouri River Breaks National Monument" data-description="Views of the buttes exposed along the river.&lt;br&gt;&lt;br&gt;&lt;i&gt;Winifred, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana003.jpg" alt="Upper Missouri River Breaks National Monument"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana004.jpg" class="gallery-item glightbox" data-title="The KPg" data-description="Outcropping of the Cretaceous-Paleogene (KPg) boundary, the boundary that marks the mass extinction which killed the dinosaurs.&lt;br&gt;&lt;br&gt;&lt;i&gt;Hell Creek Region, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana004.jpg" alt="The KPg"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana005.jpg" class="gallery-item glightbox" data-title="Field Sampling" data-description="Fellow PhD student Hee Jun Cheong (left) and our advisor Dr. Courtney Sprain (right) sampling in the field.&lt;br&gt;&lt;br&gt;&lt;i&gt;Hell Creek Region, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana005.jpg" alt="Field Sampling"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana006.jpg" class="gallery-item glightbox" data-title="Layered Butte" data-description="The Hell Creek Region features many of these gorgeous layered buttes. Person for scale.&lt;br&gt;&lt;br&gt;&lt;i&gt;Hell Creek Region, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana006.jpg" alt="Layered Butte"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana007.jpg" class="gallery-item glightbox" data-title="Dinosaur Bones" data-description="The Hell Creek Region is also peppered with dinosaur bones. While some are excavated and preserved, many become exposed by rain and erosion and break apart before researchers can get to them.&lt;br&gt;&lt;br&gt;It is illegal to collect these bones without proper permits, but you can take photos!&lt;br&gt;&lt;br&gt;&lt;i&gt;Hell Creek Region, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana007.jpg" alt="Dinosaur Bones"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana008.jpg" class="gallery-item glightbox" data-title="Layered Butte" data-description="Another gorgeous layered butte.&lt;br&gt;&lt;br&gt;&lt;i&gt;Hell Creek Region, Montana (2021))&lt;/i&gt;"> <img src="/assets/img/montana/montana008.jpg" alt="Layered Butte"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana009.jpg" class="gallery-item glightbox" data-title="Field Notes" data-description="My PhD advisor Dr. Courtney Sprain looking cool taking notes in the field.&lt;br&gt;&lt;br&gt;&lt;i&gt;Hell Creek Region, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana009.jpg" alt="Field Notes"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana010.jpg" class="gallery-item glightbox" data-title="Ashland Motel" data-description="A motel and a cool older car.&lt;br&gt;&lt;br&gt;&lt;i&gt;Ashland, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana010.jpg" alt="Ashland Motel"> </a> </div> <div class="gallery-item"> <a href="/assets/img/montana/montana011.jpg" class="gallery-item glightbox" data-title="Clinker Chimney" data-description="A chimney from a clinker deposit featuring melt banding.&lt;br&gt;&lt;br&gt;Clinkers are pyrometamorphic rocks formed by the burning of coal seams. Lightning strikes, wildfires, or other processes ignite the coal and it burns under the ground, baking and even melting the overlying rocks.&lt;br&gt;&lt;br&gt;&lt;i&gt;Ashland, Montana (2021)&lt;/i&gt;"> <img src="/assets/img/montana/montana011.jpg" alt="Clinker Chimney"> </a> </div> </div> <link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet"> <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script> <script>
